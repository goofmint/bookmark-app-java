<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>編集 - Bookmark Manager</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="page">
    <section class="panel">
        <div class="section-heading">
            <div>
                <h1>ブックマークを編集</h1>
                <p>タイトル、メモ、タグを編集して保存します。</p>
            </div>
            <a href="/" class="bookmark-action">戻る</a>
        </div>

        <form class="bookmark-form" method="post" th:action="@{/bookmarks/{id}/update(id=${bookmark.id()})}">
            <label>
                <span>タイトル</span>
                <input name="title" type="text" maxlength="100" th:value="${bookmark.title()}" required>
                <p class="form-error" th:if="${errors != null and errors.containsKey('title')}" th:text="${errors['title']}">タイトルを入力してください。</p>
            </label>
            <label>
                <span>メモ</span>
                <textarea name="description" rows="5" maxlength="300" placeholder="任意でメモを追加できます。" th:text="${bookmark.description()}"></textarea>
                <p class="form-error" th:if="${errors != null and errors.containsKey('description')}" th:text="${errors['description']}">メモは300文字以下で入力してください。</p>
            </label>
            <label>
                <span>タグ（カンマ区切り）</span>
                <input name="tags" type="text" maxlength="200" th:value="${bookmark.tags()}">
            </label>
            <label>
                <span>URL</span>
                <input type="text" th:value="${bookmark.url()}" disabled>
            </label>
            <button type="submit">更新</button>
        </form>
    </section>
</main>
</body>
</html>
