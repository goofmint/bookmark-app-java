<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="page">
    <section class="panel">
        <div class="section-heading">
            <h1>Bookmark Manager</h1>
            <p>SQLiteに保存するローカル用ブックマーク管理アプリ</p>
        </div>

        <form class="bookmark-form" method="post" action="/bookmarks">
            <label>
                <span>URL</span>
                <input name="url" type="text" required maxlength="1000" placeholder="https://example.com" th:value="${url}">
            </label>
            <button type="submit">追加</button>
            <p class="form-error" th:if="${error != null}" th:text="${error}">URLを確認してください。</p>
        </form>
    </section>

    <section class="bookmarks">
        <div class="section-heading compact">
            <h2>保存済みブックマーク</h2>
            <p th:text="${#lists.size(bookmarks)} + '件'">0件</p>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(bookmarks)}">まだブックマークはありません。</p>

        <article class="bookmark-card"
                 th:classappend="${bookmark.ogpImageUrl() == null} ? ' without-image'"
                 th:each="bookmark : ${bookmarks}">
            <img class="bookmark-image"
                 th:if="${bookmark.ogpImageUrl() != null}"
                 th:src="${bookmark.ogpImageUrl()}"
                 alt="">
            <div class="bookmark-body">
                <div class="bookmark-header">
                    <a class="bookmark-title" th:href="${bookmark.url()}" th:text="${bookmark.title()}" target="_blank" rel="noreferrer">
                        Bookmark title
                    </a>
                    <div class="bookmark-actions" aria-label="ブックマーク操作">
                        <details class="edit-panel">
                            <summary aria-label="編集" title="編集">✏️</summary>
                            <form class="edit-form" method="post" th:action="@{/bookmarks/{id}/edit(id=${bookmark.id()})}">
                                <label>
                                    <span>タグ（カンマ区切り）</span>
                                    <input name="tags" type="text" maxlength="500" placeholder="java, spring" th:value="${bookmark.tags()}">
                                </label>
                                <label>
                                    <span>メモ</span>
                                    <textarea name="description" rows="3" maxlength="2000" placeholder="メモを入力" th:text="${bookmark.description()}"></textarea>
                                </label>
                                <button type="submit">保存</button>
                            </form>
                        </details>
                        <form class="delete-form" method="post" th:action="@{/bookmarks/{id}/delete(id=${bookmark.id()})}" onsubmit="return confirm('削除しますか？')">
                            <button class="icon-button danger-button" type="submit" aria-label="削除" title="削除">🗑️</button>
                        </form>
                    </div>
                </div>
                <p class="bookmark-url" th:text="${bookmark.url()}">https://example.com</p>
                <p class="bookmark-description"
                   th:if="${!#strings.isEmpty(bookmark.description())}"
                   th:text="${bookmark.description()}">メモ</p>
                <div class="bookmark-meta">
                    <th:block th:if="${!#strings.isEmpty(bookmark.tags())}">
                        <span th:each="tag : ${#strings.arraySplit(bookmark.tags(), ',')}"
                              th:if="${!#strings.isEmpty(#strings.trim(tag))}"
                              th:text="${#strings.trim(tag)}">tag</span>
                    </th:block>
                    <time th:text="${bookmark.createdAt()}">created_at</time>
                </div>
            </div>
        </article>
    </section>
</main>
</body>
</html>
